name: Publish TinySuite website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tinysuite-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout TinySuite
        uses: actions/checkout@v4
      - name: Setup Node for dist integrity checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install workspace build tools
        run: npm ci
      - name: Verify tracked distributions and demo dependencies
        run: npm run verify
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify TinySuite website
        run: |
          python3 scripts/build-site.py
          python3 scripts/verify_site.py
          test -f .build/site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .build/site
      - name: Deploy website
        id: deploy
        uses: actions/deploy-pages@v4
