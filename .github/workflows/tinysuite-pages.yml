name: Publish TinySuite website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tinysuite-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout TinySuite
        uses: actions/checkout@v4
      - name: Setup Node for dist integrity checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install workspace build tools
        run: npm ci
      - name: Verify tracked distributions and demo dependencies
        run: npm run verify
      - name: Diagnose TinyDataTable CSS mismatch
        if: failure()
        run: |
          FILE="TinyDataTable/dist/TinyDataTable.min.css"

          echo "=== Environment ==="
          node --version
          npm --version
          git rev-parse HEAD

          echo "=== CSS tracked by Git ==="
          git show "HEAD:$FILE" | sha256sum
          sha256sum "$FILE"

          cp "$FILE" /tmp/tinydatatable-before.css

          echo "=== Regenerate distributions ==="
          node scripts/build-dist.cjs

          echo "=== Generated CSS ==="
          sha256sum "$FILE"
          git diff --numstat -- "$FILE"

          python3 - <<'PY'
          from pathlib import Path

          old = Path("/tmp/tinydatatable-before.css").read_bytes()
          new = Path("TinyDataTable/dist/TinyDataTable.min.css").read_bytes()

          pos = next(
              (i for i, (a, b) in enumerate(zip(old, new)) if a != b),
              min(len(old), len(new))
          )

          print(f"Original: {len(old)} bytes")
          print(f"Generated: {len(new)} bytes")
          print(f"First difference at byte: {pos}")
          print(f"Original excerpt: {old[max(0,pos-60):pos+100]!r}")
          print(f"Generated excerpt: {new[max(0,pos-60):pos+100]!r}")
          PY        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify TinySuite website
        run: |
          python3 scripts/build-site.py
          python3 scripts/verify_site.py
          test -f .build/site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .build/site
      - name: Deploy website
        id: deploy
        uses: actions/deploy-pages@v4
