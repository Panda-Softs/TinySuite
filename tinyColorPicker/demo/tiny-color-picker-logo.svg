<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="title desc">
  <title id="title">TinyColorPicker palette logo</title>
  <desc id="desc">A floating glass palette card with colorful swatches.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect x="22" y="22" width="112" height="112" rx="25" fill="url(#accent)" opacity=".95"/>
  <rect x="86" y="44" width="390" height="246" rx="30" fill="#ffffff" filter="url(#shadow)"/>
  <text x="122" y="94" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="1.4">TINY COLOR PICKER</text>
  <g transform="translate(122 122)">
    <rect width="42" height="42" rx="11" fill="#1abc9c"/><rect x="54" width="42" height="42" rx="11" fill="#2ecc71"/><rect x="108" width="42" height="42" rx="11" fill="#3498db"/><rect x="162" width="42" height="42" rx="11" fill="#9b59b6"/><rect x="216" width="42" height="42" rx="11" fill="#34495e"/>
    <rect y="54" width="42" height="42" rx="11" fill="#f1c40f"/><rect x="54" y="54" width="42" height="42" rx="11" fill="#f39c12"/><rect x="108" y="54" width="42" height="42" rx="11" fill="#e67e22"/><rect x="162" y="54" width="42" height="42" rx="11" fill="#e74c3c"/><rect x="216" y="54" width="42" height="42" rx="11" fill="#95a5a6"/>
    <rect y="108" width="42" height="42" rx="11" fill="#16a085"/><rect x="54" y="108" width="42" height="42" rx="11" fill="#2980b9"/><rect x="108" y="108" width="42" height="42" rx="11" fill="#8e44ad"/><rect x="162" y="108" width="42" height="42" rx="11" fill="#c0392b"/><rect x="216" y="108" width="42" height="42" rx="11" fill="#bdc3c7"/>
  </g>
</svg>
